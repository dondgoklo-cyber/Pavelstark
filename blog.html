    <script>
    document.addEventListener("academy:components-ready", function () {
      var posts = [
        { date: "15 января 2024", title: "Изменения в охране труда на 2024 год", excerpt: "Что изменилось в законодательстве по охране труда и как это влияет на обучение.", cover: "ОТ" },
        { date: "10 января 2024", title: "Как выбрать курс профпереподготовки", excerpt: "Чем отличается переподготовка от повышения квалификации и как выбрать программу.", cover: "↻" },
        { date: "5 января 2024", title: "ФИС ФРДО: как проверить документ", excerpt: "Пошаговая инструкция, как убедиться, что документ внесён в реестр.", cover: "ФР" },
        { date: "28 декабря 2023", title: "Рабочие профессии: востребованность 2024", excerpt: "Анализ рынка труда: какие специальности будут в спросе.", cover: "⚙" }
      ];
      var grid = document.querySelector("[data-blog-grid]");
      if (grid) {
        grid.innerHTML = posts.map(function (p) {
          return '<article class="blog-card"><div class="blog-card__cover">' + p.cover + "</div>" +
            '<div class="blog-card__body"><p class="blog-card__date">' + p.date + "</p>" +
            '<h3 class="blog-card__title">' + p.title + "</h3>" +
            '<p class="blog-card__excerpt">' + p.excerpt + "</p>" +
            '<a href="#" class="btn btn--ghost btn--sm">Читать</a></div></article>";
        }).join("");
      }
    });
    </script>
