<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DABF7"/>
      <stop offset="1" stop-color="#C9A23A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4DABF7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4DABF7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Декоративная сетка -->
  <g opacity="0.04" stroke="#4DABF7" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Иконка -->
  <g transform="translate(350,120)">
    <circle cx="200" cy="60" r="40" fill="url(#acc)" fill-opacity="0.2" stroke="url(#acc)" stroke-width="4"/>
    <text x="200" y="72" font-family="Georgia,serif" font-size="32" font-weight="700" fill="url(#acc)" text-anchor="middle">?</text>
    <path d="M200 100 C200 200 80 220 80 340" stroke="url(#acc)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200 100 C200 200 320 220 320 340" stroke="url(#acc)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="20" y="340" width="120" height="60" rx="14" fill="none" stroke="url(#acc)" stroke-width="3" stroke-opacity="0.6"/>
    <text x="80" y="378" font-family="Arial,sans-serif" font-size="16" fill="url(#acc)" text-anchor="middle" opacity="0.8">3-6 мес</text>
    <rect x="260" y="340" width="120" height="60" rx="14" fill="none" stroke="url(#acc)" stroke-width="3" stroke-opacity="0.6"/>
    <text x="320" y="378" font-family="Arial,sans-serif" font-size="16" fill="url(#acc)" text-anchor="middle" opacity="0.8">3-5 лет</text>
  </g>
  <!-- Текст -->
  <text x="80" y="540" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FFFFFF">Переподготовка vs ВУЗ</text>
  <text x="82" y="575" font-family="Arial, sans-serif" font-size="18" fill="#4DABF7" opacity="0.7">Академия ДПО · Блог</text>
  <!-- Логотип-знак -->
  <rect x="80" y="50" width="52" height="52" rx="14" fill="url(#acc)"/>
  <text x="106" y="86" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0E1420" text-anchor="middle">A</text>
</svg>