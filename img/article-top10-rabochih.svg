<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51CF66"/>
      <stop offset="1" stop-color="#C9A23A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#51CF66" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#51CF66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Декоративная сетка -->
  <g opacity="0.04" stroke="#51CF66" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Иконка -->
  <g transform="translate(420,170)">
    <circle cx="180" cy="140" r="120" fill="none" stroke="url(#acc)" stroke-width="4"/>
    <circle cx="180" cy="140" r="50" fill="none" stroke="url(#acc)" stroke-width="4"/>
    <g fill="url(#acc)" fill-opacity="0.9">
      <rect x="170" y="0" width="20" height="35" rx="4"/>
      <rect x="170" y="245" width="20" height="35" rx="4"/>
      <rect x="0" y="130" width="35" height="20" rx="4"/>
      <rect x="325" y="130" width="35" height="20" rx="4"/>
      <rect x="50" y="40" width="30" height="20" rx="4" transform="rotate(45 65 50)"/>
      <rect x="280" y="40" width="30" height="20" rx="4" transform="rotate(-45 295 50)"/>
      <rect x="50" y="220" width="30" height="20" rx="4" transform="rotate(-45 65 230)"/>
      <rect x="280" y="220" width="30" height="20" rx="4" transform="rotate(45 295 230)"/>
    </g>
    <circle cx="180" cy="140" r="20" fill="url(#acc)"/>
  </g>
  <!-- Текст -->
  <text x="80" y="540" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FFFFFF">Рабочие профессии</text>
  <text x="82" y="575" font-family="Arial, sans-serif" font-size="18" fill="#51CF66" opacity="0.7">Академия ДПО · Блог</text>
  <!-- Логотип-знак -->
  <rect x="80" y="50" width="52" height="52" rx="14" fill="url(#acc)"/>
  <text x="106" y="86" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0E1420" text-anchor="middle">A</text>
</svg>