<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#C9A23A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Декоративная сетка -->
  <g opacity="0.04" stroke="#F5C542" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Иконка -->
  <g transform="translate(400,180)">
    <path d="M200 0 L380 70 L380 250 C380 380 200 460 200 460 C200 460 20 380 20 250 L20 70 Z" fill="none" stroke="url(#acc)" stroke-width="4"/>
    <path d="M200 0 L380 70 L380 250 C380 380 200 460 200 460 C200 460 20 380 20 250 L20 70 Z" fill="url(#acc)" fill-opacity="0.08"/>
    <path d="M130 210 L185 265 L280 160" stroke="url(#acc)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="230" r="90" fill="url(#acc)" fill-opacity="0.06"/>
  </g>
  <!-- Текст -->
  <text x="80" y="540" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FFFFFF">Охрана труда 2025</text>
  <text x="82" y="575" font-family="Arial, sans-serif" font-size="18" fill="#F5C542" opacity="0.7">Академия ДПО · Блог</text>
  <!-- Логотип-знак -->
  <rect x="80" y="50" width="52" height="52" rx="14" fill="url(#acc)"/>
  <text x="106" y="86" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0E1420" text-anchor="middle">A</text>
