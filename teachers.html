<head>

<body>
  <div data-header></div>
  <script type="application/ld+json" data-schema-organization></script>
  <main>
    <section class="page-header" id="top">
      <div class="container">
        <div class="page-header__inner">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a>
        <span class="breadcrumbs__sep">/</span>
        <span>Преподаватели</span>
      </nav>
          <p class="page-header__eyebrow">Команда</p>
          <h1 class="page-header__title">Преподаватели-практики</h1>
          <p class="page-header__lead">Эксперты с опытом 10+ лет, действующие специалисты отрасли. Живые кейсы, а не сухая теория.</p>
        </div>

    <section class="section">

    </section>
    <section class="section section--accent">
      <div class="container">
        <div class="cta-band reveal" data-reveal>
          <h2 class="cta-band__title">Готовы записаться?</h2>
          <p class="cta-band__text">Оставьте заявку — менеджер перезвонит в течение 15 минут.</p>

  <div data-footer></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>

    <script>
    document.addEventListener("academy:components-ready", function () {
      var teachers = [
        { name: "Иванов А.М.", role: "Охрана труда", initials: "ИМ", bio: "Инженер по ОТ с 15-летним стажем. Аудитор СМК." },
        { name: "Петрова Е.С.", role: "Бухучёт", initials: "ПЕ", bio: "Главный бухгалтер, преподаватель с 12-летним опытом." },
        { name: "Сидоров К.В.", role: "Электромонтёр", initials: "СК", bio: "Мастер производственного обучения, 5-й разряд." },
        { name: "Кузнецова О.Н.", role: "Менеджмент", initials: "КО", bio: "MBA, бизнес-тренер, консультант по управлению." }
      ];
      var grid = document.querySelector("[data-teachers-grid]");
      if (grid) {
        grid.innerHTML = teachers.map(function (t) {
          return '<article class="teacher-card">' +
            '<div class="teacher-card__avatar">' + t.initials + "</div>" +
            '<h3 class="teacher-card__name">' + t.name + "</h3>" +
            '<p class="teacher-card__role">' + t.role + "</p>" +
            '<p class="teacher-card__bio">' + t.bio + "</p></article>";
        }).join("");
      }
    });
    </script>
