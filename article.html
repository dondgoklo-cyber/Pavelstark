            { h: "Что такое дистанционное ДПО" },
            { p: "Дистанционные образовательные технологии (ДОТ) — это обучение через интернет: видеолекции, тесты, электронные учебники, вебинары. Вы не ходите в аудиторию, а учитесь дома или на работе. Документ — тот же, что и при очном обучении: диплом, удостоверение или свидетельство государственного образца." },
            { pullquote: "Дистанционный диплом ничем не отличается от очного. В нём не пишется «заочное обучение» — указывается только форма: очная, очно-заочная или дистанционная." },
            { h: "Плюсы дистанционного формата" },
            { ul: [
              "Учитесь в удобное время — нет привязки к расписанию",
              "Не нужно ехать в учебный центр — экономия времени и денег на дорогу",
              "Доступ к материалам 24/7 — можно пересматривать лекции",
              "Документ приходит по почте — не нужно никуда идти за ним",
              "Стоит дешевле очного — нет расходов на аренду аудиторий"
            ]},
            { h: "Минусы: о чём молчат" },
            { p: "Дистанционка — не для всех. Главный минус — самодисциплина. Если вы не можете заставить себя открыть курс вечером, обучение растянется на годы. Кроме того, для некоторых профессий онлайн не подходит:" },
            { ul: [
              "Рабочие профессии (сварщик, электромонтёр) — нужна практика с оборудованием",
              "Медицинские специальности — отработка навыков на манекенах",
              "Водители — практическое вождение невозможно онлайн"
            ]},
            { infobox: { title: "Как выбрать честный учебный центр", text: "Проверьте три вещи: 1) Лицензия на образовательную деятельность (можно проверить на сайте Рособрнадзора). 2) Внесение в ФИС ФРДО после обучения. 3) Отзывы и срок работы — не менее 3 лет на рынке." }},
            { h: "Как организовать процесс" },
            { p: "Чтобы дистанционное обучение сработало, нужен план. Вот что помогает нашим студентам:" },
            { ul: [
              "Выделите фиксированное время — например, по вторникам и четвергам с 19:00",
              "Проходите модули последовательно — не перепрыгивайте",
              "Делайте конспекты — даже электронные заметки помогают запомнить",
              "Не откладывайте тестирование на последний день срока"
            ]},
            { p: "Академия ДПО проводит большинство программ в дистанционном формате. Платформа доступна 24/7, техподежда отвечает в течение часа, а документы доставляются по всей России курьером." }
          ]
        },
        "proverka-diploma": {
          date: "10 октября 2024",
          readTime: "4 мин",
          cover: "img/article-proverka-diploma.svg",
          title: "Как проверить подлинность диплома ДПО через ФИС ФРДО за 5 минут",
          body: [
            { p: "Купили диплом на Авито? Шутка, но некоторые реально так делают. Серьёзно: поддельные документы об образовании — проблема, которая касается и работодателя, и самого работника. Если диплом не внесён в ФИС ФРДО, он недействителен. Рассказываем, как проверить любой документ за 5 минут." },
            { h: "Что такое ФИС ФРДО" },
            { p: "Федеральный реестр сведений о документах об обучении — это единая государственная база. С 2019 года все учебные центры обязаны вносить данные о выданных дипломах, удостоверениях и свидетельствах в течение 60 дней. Если документа нет в реестре — он не имеет юридической силы." },
            { pullquote: "ФИС ФРДО — это как ЕГРЮЛ для дипломов. Нет в реестре — нет документа. Проверка бесплатная и занимает 2 минуты." },
            { h: "Пошаговая инструкция" },
            { p: "Проверка простая. Не нужно никуда идти, всё делается онлайн:" },
            { ul: [
              "Зайдите на сайт checkovrnadzor.ru (официальный сервис Рособрнадзора)",
              "Выберите тип документа: диплом, удостоверение или свидетельство",
              "Введите данные: серию, номер, ФИО выпускника",
              "Нажмите «Проверить» — система покажет, внесён ли документ",
              "Сверьте данные из реестра с документом на руках"
            ]},
            { infobox: { title: "Что делать, если документа нет в реестре", text: "Если документ выдан недавно (менее 60 дней назад), его может ещё не быть в базе — это нормально. Если прошло больше 60 дней — обращайтесь в учебный центр. Если центр не отвечает или закрылся — документ, скорее всего, поддельный." }},
            { h: "На что обратить внимание работодателю" },
            { p: "Если вы принимаете на работу сотрудника с дипломом ДПО, проверьте три вещи:" },
            { ul: [
              "Есть ли документ в ФИС ФРДО (см. инструкцию выше)",
              "Совпадает ли ФИО в документе с паспортом кандидата",
              "Соответствует ли специальность должности — иногда диплом по бухучёту не даёт права работать инженером по ОТ"
            ]},
            { h: "А если документ поддельный?" },
            { p: "Предъявление поддельного документа при приёме на работу — основание для увольнения (п. 11 ч. 1 ст. 81 ТК РФ). Работодатель также может обратиться в прокуратуру. Для работника это грозит уголовной ответственностью по ст. 327 УК РФ." },
            { p: "Все документы Академии ДПО вносятся в ФИС ФРДО в установленный законом срок — 60 дней с момента выдачи. Мы предоставляем выписку из реестра по запросу выпускника." }
          ]
        }
      };

      var params = new URLSearchParams(location.search);
      var id = params.get("id");
      var article = ARTICLES[id];

      if (!article) {
        document.querySelector("[data-article-h1]").textContent = "Статья не найдена";
        document.querySelector("[data-article-cover-slot]").style.display = "none";
        document.querySelector("[data-article-body]").innerHTML = '<p>К сожалению, такой статьи нет. <a href="blog.html">&#8592; Вернуться в блог</a></p>';
        document.querySelector("[data-related-slot]").style.display = "none";
        return;
      }

      document.title = article.title + " — Академия ДПО";
      document.querySelector("[data-article-title]").textContent = article.title + " — Академия ДПО";
      document.querySelector("[data-article-h1]").textContent = article.title;
      document.querySelector("[data-article-date]").textContent = article.date;
      document.querySelector("[data-article-readtime]").textContent = article.readTime;
      document.querySelector("[data-article-eyebrow]").textContent = "Блог";

      var bcEl = document.querySelector("[data-article-breadcrumb]");
      if (bcEl) bcEl.textContent = article.title.length > 50 ? article.title.slice(0, 50) + "\u2026" : article.title;

      /* Обложка */
      var coverSlot = document.querySelector("[data-article-cover-slot]");
      if (coverSlot && article.cover) {
        coverSlot.innerHTML = '<img src="' + esc(article.cover) + '" alt="' + esc(article.title) + '" loading="lazy" />';
      }

      /* Тело */
      var bodyHtml = "";
      article.body.forEach(function (block) {
        if (block.p) bodyHtml += "<p>" + esc(block.p) + "</p>";
        else if (block.h) bodyHtml += "<h3>" + esc(block.h) + "</h3>";
        else if (block.ul) bodyHtml += "<ul>" + block.ul.map(function(li){return "<li>"+esc(li)+"</li>";}).join("") + "</ul>";
        else if (block.pullquote) bodyHtml += '<div class="pullquote">' + esc(block.pullquote) + "</div>";
        else if (block.infobox) bodyHtml += '<div class="infobox"><p class="infobox__title">' + esc(block.infobox.title) + '</p><p>' + esc(block.infobox.text) + "</p></div>";
      });
      document.querySelector("[data-article-body]").innerHTML = bodyHtml;

      /* Поделиться */
      var url = encodeURIComponent(location.href);
      var title = encodeURIComponent(article.title);
      var tg = document.querySelector("[data-share-tg]");
      var vk = document.querySelector("[data-share-vk]");
      var wa = document.querySelector("[data-share-wa]");
      if (tg) tg.href = "https://t.me/share/url?url=" + url + "&text=" + title;
      if (vk) vk.href = "https://vk.com/share.php?url=" + url + "&title=" + title;
      if (wa) wa.href = "https://wa.me/?text=" + title + "%20" + url;

      /* Похожие статьи (остальные, кроме текущей) */
      var related = [];
      Object.keys(ARTICLES).forEach(function(k){
        if (k !== id) related.push({ id: k, title: ARTICLES[k].title, date: ARTICLES[k].date, cover: ARTICLES[k].cover });
      });
      var relSlot = document.querySelector("[data-related-slot]");
      if (relSlot) {
        relSlot.innerHTML = '<h2 class="related__title">Читайте также</h2><div class="related__grid">' +
          related.map(function(r){
            return '<a href="article.html?id=' + esc(r.id) + '" class="related__card">' +
              '<div style="width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--bg-panel-2)">' +
              '<img src="' + esc(r.cover) + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover" />' +
              '</div><div><p class="related__card-title">' + esc(r.title) + '</p>' +
              '<p class="related__card-date">' + esc(r.date) + '</p></div></a>';
          }).join("") + '</div>';
      }

      /* Reveal-анимации */
      if (typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
        document.querySelectorAll(".reveal:not(.is-visible)").forEach(function(el){
          gsap.fromTo(el, {opacity:0,y:30},{opacity:1,y:0,duration:0.7,ease:"power3.out",scrollTrigger:{trigger:el,start:"top 85%",once:true,onEnter:function(){el.classList.add("is-visible");}}});
        });
      }
    });
  </script>
</body>
</html>
