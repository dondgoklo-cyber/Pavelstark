<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A2332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <title data-article-title>Статья — Академия ДПО</title>
  <meta name="description" content="Статья блога Академии ДПО." />
</head>
<body>
  <main>
    <section class="page-hero section--dark">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <a href="index.html">Главная</a><span aria-hidden="true">/</span>
          <a href="blog.html">Блог</a><span aria-hidden="true">/</span>
          <span aria-current="page" data-article-breadcrumb>Статья</span>
        </nav>
        <p class="section__eyebrow reveal" data-reveal data-article-date>Блог</p>
        <h1 class="page-hero__title reveal" data-reveal data-article-h1>Заголовок статьи</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="prose" data-article-body>
          <p>Загрузка статьи…</p>
        </div>

        <div style="margin-top:48px">
          <a href="blog.html" class="btn btn--ghost">← Все статьи</a>
        </div>
      </div>
    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/main.js" defer></script>

  <!-- Каталог статей + рендер -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      /* Каталог статей: id совпадает с ?id= в URL */
      var ARTICLES = {
        "oh-2025": {
          date: "15 ноября 2024",
          title: "Изменения в законодательстве по охране труда в 2025 году",
          body: [
            { p: "С 1 марта 2025 года вступают в силу поправки в Трудовой кодекс, которые меняют требования к обучению по охране труда. Разбираемся, что именно изменится для работодателей и специалистов по ОТ." },
            { h: "Что нового" },
            { p: "Главное изменение — ужесточение требований к periodicity обучения. Теперь руководители и специалисты обязаны проходить повышение квалификации по охране труда не реже одного раза в три года (ранее — раз в пять лет)." },
            { ul: [
              "Расширение перечня категорий работников, обязанных проходить обучение",
              "Новые формы контроля знаний с использованием ЭОМ",
              "Усиление ответственности за необученных сотрудников",
              "Ведение электронного журнала учёта обучения"
            ]},
            { h: "Как подготовиться" },
            { p: "Мы рекомендуем заранее спланировать график обучения на 2025 год. Академия ДПО проводит курсы по охране труда в очном и дистанционном форматах с выдачей удостоверения установленного образца и внесением в ФИС ФРДО." },
            { h: "Документы" },
            { p: "После прохождения курса вы получаете удостоверение о повышении квалификации. Сведения вносятся в Федеральный реестр сведений документов об обучении (ФИС ФРДО) в течение 60 дней." }
          ]
        },
        "top10-rabochih": {
          date: "8 ноября 2024",
          title: "ТОП-10 востребованных рабочих профессий 2025",
          body: [
            { p: "Аналитика рынка труда показывает: дефицит квалифицированных рабочих кадров в России растёт. По данным HeadHunter, количество вакансий для рабочих специальностей за год увеличилось на 23%." },
            { h: "Самые востребованные" },
            { ul: [
              "Электромонтёр — средняя зарплата 85 000 ₽",
              "Сварщик — 95 000 ₽",
              "Стропальщик — 70 000 ₽",
              "Машинист крана — 90 000 ₽",
              "Слесарь-ремонтник — 75 000 ₽"
            ]},
            { h: "Почему стоит обратить внимание" },
            { p: "Рабочие профессии обеспечивают стабильный доход и быстрый старт. Обучение занимает от 1 до 3 месяцев, после чего вы получаете свидетельство о профессии рабочего и можете сразу устроиться на работу." },
            { p: "Академия ДПО предлагает программы подготовки по всем перечисленным специальностям с очным и дистанционным форматом обучения." }
          ]
        },
        "akkreditaciya-med": {
          date: "1 ноября 2024",
          title: "Как пройти аккредитацию медицинских работников",
          body: [
            { p: "Аккредитация медицинских работников — обязательная процедура подтверждения квалификации для врачей, медсестёр и фармацевтов. Разбираем процесс пошагово." },
            { h: "Этапы аккредитации" },
            { ul: [
              "Подготовка портфолио: сертификаты, дипломы, отчёты",
              "Сдача тестирования (ЭВМ)",
              "Оценка практических навыков (ОСКЭ)",
              "Получение свидетельства об аккредитации"
            ]},
            { h: "Сроки" },
            { p: "Первичная аккредитация проходит после окончания обучения. Последующая — каждые 5 лет. Специалисты с высшим образованием проходят процедуру каждые 5 лет, со средним — каждые 5 лет." },
            { h: "Подготовка" },
            { p: "Для успешной аккредитации рекомендуем пройти курсы повышения квалификации. Академия ДПО предлагает программы для медицинских работников с подготовкой к тестированию и оценке практических навыков." }
          ]
        },
        "perepodgotovka-vs-vuz": {
          date: "25 октября 2024",
          title: "Профпереподготовка vs второе высшее: что выбрать",
          body: [
            { p: "Получить новую профессию можно двумя путями: профессиональная переподготовка или второе высшее образование. Сравниваем по ключевым параметрам." },
            { h: "Сравнение" },
            { ul: [
              "Сроки: переподготовка 3–6 месяцев, второе высшее 3–5 лет",
              "Стоимость: переподготовка от 20 000 ₽, второе высшее от 300 000 ₽",
              "Документ: диплом о переподготовке vs диплом о высшем образовании",
              "Глубина: переподготовка — профильные темы, второе высшее — фундаментально"
            ]},
            { h: "Кому что подходит" },
            { p: "Профпереподготовка идеальна, если у вас уже есть высшее или среднее профессиональное образование и вы хотите сменить профиль или расширить компетенции. Второе высшее стоит выбирать, если нужна фундаментальная база в новой сфере." },
            { p: "В большинстве случаев профпереподготовка быстрее и дешевле, а документ даёт право работать по новой специальности." }
          ]
        },
        "distancionnoe-obuchenie": {
          date: "18 октября 2024",
          title: "Дистанционное обучение: плюсы, минусы, советы",
          body: [
            { p: "Дистанционный формат стал стандартом в дополнительном профессиональном образовании. Разбираем его преимущества и недостатки." },
            { h: "Плюсы" },
            { ul: [
              "Учитесь в удобное время и в удобном темпе",
              "Не нужно ездить на обучение — экономия времени и денег",
              "Доступ к материалам 24/7",
              "Документ государственного образца по почте"
            ]},
            { h: "Минусы" },
            { p: "Главный минус — необходимость самодисциплины. Также для некоторых профессий (например, рабочие специальности) требуется практическая часть, которую сложно освоить онлайн." },
            { h: "Советы" },
            { p: "Выбирайте лицензированные учебные центры с внесением в ФИС ФРДО. Проверьте, что формат документа соответствует вашим целям: удостоверение, диплом или свидетельство." },
            { p: "Академия ДПО проводит большинство программ в дистанционном формате с доставкой документов по всей России." }
          ]
        },
        "proverka-diploma": {
          date: "10 октября 2024",
          title: "Как проверить подлинность диплома ДПО",
          body: [
            { p: "Подлинность документа об образовании — важный вопрос и для работодателя, и для самого специалиста. Рассказываем, как проверить диплом через ФИС ФРДО." },
            { h: "Что такое ФИС ФРДО" },
            { p: "Федеральный реестр сведений о документах об образовании — единая база, в которую учебные центры обязаны вносить данные о выданных дипломах, удостоверениях и свидетельствах." },
            { h: "Как проверить" },
            { ul: [
              "Зайдите на сайт ФИС ФРДО (frdoobrnadzor.ru)",
              "Введите данные документа: серию, номер, ФИО выпускника",
              "Система покажет, внесён ли документ в реестр",
              "Проверьте совпадение данных с документом на руках"
            ]},
            { h: "На что обратить внимание" },
            { p: "Сведения вносятся в течение 60 дней с момента выдачи. Если документ свежий, его может ещё не быть в базе — это нормально. Учебный центр должен предоставить подтверждающие документы." },
            { p: "Все документы Академии ДПО вносятся в ФИС ФРДО в установленный срок." }
          ]
        }
      };

      function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

      var params = new URLSearchParams(location.search);
      var id = params.get("id");
      var article = ARTICLES[id];

      if (!article) {
        /* Статья не найдена — редирект на блог */
        document.querySelector("[data-article-h1]").textContent = "Статья не найдена";
        document.querySelector("[data-article-body]").innerHTML = '<p>К сожалению, такой статьи нет. <a href="blog.html">← Вернуться в блог</a></p>';
        return;
      }

      /* Заголовок страницы */
      document.title = article.title + " — Академия ДПО";
      document.querySelector("[data-article-title]").textContent = article.title + " — Академия ДПО";
      document.querySelector("[data-article-h1]").textContent = article.title;
      document.querySelector("[data-article-date]").textContent = article.date;
      document.querySelector("[data-article-breadcrumb]").textContent = article.title.length > 40 ? article.title.slice(0, 40) + "…" : article.title;

      /* Тело статьи */
      var bodyHtml = "";
      article.body.forEach(function (block) {
        if (block.p) bodyHtml += "<p>" + esc(block.p) + "</p>";
        else if (block.h) bodyHtml += "<h3>" + esc(block.h) + "</h3>";
        else if (block.ul) bodyHtml += "<ul>" + block.ul.map(function (li) { return "<li>" + esc(li) + "</li>"; }).join("") + "</ul>";
      });
      document.querySelector("[data-article-body]").innerHTML = bodyHtml;

      /* Повторная инициализация reveal-анимаций */
      if (typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
        document.querySelectorAll(".reveal:not(.is-visible)").forEach(function (el) {
          gsap.fromTo(el, { opacity: 0, y: 30 }, {
            opacity: 1, y: 0, duration: 0.7, ease: "power3.out",
            scrollTrigger: { trigger: el, start: "top 85%", once: true, onEnter: function () { el.classList.add("is-visible"); } }
          });
        });
      }
    });
  </script>
</body>
</html>
