<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#C9A23A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Декоративная сетка -->
  <g opacity="0.04" stroke="#F5C542" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Иконка -->
  <g transform="translate(380,150)">
    <rect x="20" y="20" width="360" height="230" rx="16" fill="url(#acc)" fill-opacity="0.08" stroke="url(#acc)" stroke-width="4"/>
    <rect x="50" y="50" width="300" height="170" rx="8" fill="url(#acc)" fill-opacity="0.05"/>
    <circle cx="200" cy="135" r="40" fill="none" stroke="url(#acc)" stroke-width="4"/>
    <path d="M185 135 L200 150 L220 125" stroke="url(#acc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="0" y="260" width="400" height="20" rx="6" fill="url(#acc)" fill-opacity="0.3"/>
    <rect x="160" y="260" width="80" height="20" rx="6" fill="url(#acc)"/>
    <circle cx="360" cy="50" r="14" fill="url(#acc)" fill-opacity="0.6"/>
    <circle cx="50" cy="210" r="10" fill="url(#acc)" fill-opacity="0.4"/>
  </g>
  <!-- Текст -->
  <text x="80" y="540" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FFFFFF">Дистанционное обучение</text>
  <text x="82" y="575" font-family="Arial, sans-serif" font-size="18" fill="#F5C542" opacity="0.7">Академия ДПО · Блог</text>
  <!-- Логотип-знак -->
  <rect x="80" y="50" width="52" height="52" rx="14" fill="url(#acc)"/>
  <text x="106" y="86" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0E1420" text-anchor="middle">A</text>
